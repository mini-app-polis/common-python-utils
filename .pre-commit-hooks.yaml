# Hooks other repositories use from this one, pinned by tag in their
# .pre-commit-config.yaml:
#
#   - repo: https://github.com/mini-app-polis/common-python-utils
#     rev: v<release>
#     hooks:
#       - id: facts
#
# facts: regenerates facts.json from facts.yaml before every commit. When a
# figure changed, the hook rewrites facts.json and the commit stops; add
# facts.json and commit again. CI's `facts check` stays the backstop.
- id: facts
  name: facts generate
  description: Regenerate facts.json from facts.yaml (ADR-0016).
  entry: facts generate
  language: python
  pass_filenames: false
  # A fact can be drawn from any file in the repository, so the hook runs
  # on every commit rather than only when particular files change.
  always_run: true
