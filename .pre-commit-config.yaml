repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
  # SEC-001. Same gitleaks the shared security workflow runs in CI, so a
  # secret is caught before it is committed rather than after it is pushed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  # ADR-0016. This repository defines the shared facts hook
  # (.pre-commit-hooks.yaml); here it runs from the working copy.
  - repo: local
    hooks:
      - id: facts
        name: facts generate
        entry: uv run --frozen facts generate
        language: system
        pass_filenames: false
        always_run: true
